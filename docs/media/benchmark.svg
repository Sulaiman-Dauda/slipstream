<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 574" width="960" height="574" role="img" aria-labelledby="t d">
<title id="t">Slipstream against CloudPanel on the same server</title>
<desc id="d">How many times better each panel was, log scale. Cached throughput, 500 connections: 9,280 vs 2,259 req/s; p99 latency at that load: 85.5 ms vs 385.9 ms, 319 CloudPanel timeouts; Static file, 200 connections: 12,636 vs 2,767 req/s; 2,000-connection flood, over a network: 11,483 vs 1,562 req/s; Install, bare server to running panel: 105 s vs 460 s; Memory added at idle: 151 MB vs 498 MB; Disk added: 0.61 GB vs 4.58 GB; Uncacheable shop page, over a network: 5.44 vs 21.99 req/s. Measured 3 September 2026.</desc>
<style>
.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}
.grid{stroke:#e1e0d9}.base{stroke:#c3c2b7}.win{fill:#2a78d6}.loss{fill:#e34948}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}
.grid{stroke:#2c2c2a}.base{stroke:#383835}.win{fill:#3987e5}.loss{fill:#e66767}}
</style>
