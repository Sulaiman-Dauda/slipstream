name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build
        run: make dist

      # The installer verifies these before installing, so publish them
      # alongside the binaries. A release without checksums cannot be installed
      # by the default (non-local-build) path.
      - name: Checksums
        run: |
          cd dist
          for f in panel-api panel-agent slipctl; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum -c panel-api.sha256 panel-agent.sha256 slipctl.sha256

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/panel-api
            dist/panel-agent
            dist/slipctl
            dist/*.sha256
            installer/install.sh
            installer/systemd/*
          generate_release_notes: true
          body: |
            Install on a **fresh** Ubuntu 24.04 or 26.04 server:

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo bash
            ```

            To pin this exact version instead of tracking the newest release:

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh \
              | sudo SLIPSTREAM_VERSION=${{ github.ref_name }} bash
            ```

            Slipstream takes over system configuration — do not install it on a
            machine already running something you care about.
