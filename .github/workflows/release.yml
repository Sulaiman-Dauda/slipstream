name: Release

on:
  push:
    tags: ['v*']

# contents: write to publish the release. id-token + attestations are what let
# GitHub sign a provenance statement for the binaries — see the Attest step.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build
        run: make dist

      # The installer verifies these before installing, so publish them
      # alongside the binaries. A release without checksums cannot be installed
      # by the default (non-local-build) path.
      - name: Checksums
        run: |
          cd dist
          for f in panel-api panel-agent slipctl; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum -c panel-api.sha256 panel-agent.sha256 slipctl.sha256

      # The checksums above live in the same release as the binaries they
      # describe, so anyone able to write that release could replace both and
      # the verification would still pass. A provenance attestation is signed by
      # GitHub's OIDC identity for this workflow and stored outside the release,
      # so it proves these exact bytes were built by this workflow from this
      # commit. That matters here more than most projects: the installer is run
      # as root via `curl | sudo bash`.
      #
      # Verify one with:
      #   gh attestation verify panel-agent --repo Sulaiman-Dauda/slipstream
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/panel-api
            dist/panel-agent
            dist/slipctl

      - name: Publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/panel-api
            dist/panel-agent
            dist/slipctl
            dist/*.sha256
            installer/install.sh
            installer/systemd/*
          generate_release_notes: true
          body: |
            Install on a **fresh** Ubuntu 24.04 or 26.04 server:

            ```bash
            curl -fsSL https://get.slipstreampanel.com | sudo bash
            ```

            To pin this exact version instead of tracking the newest release:

            ```bash
            curl -fsSL https://get.slipstreampanel.com/${{ github.ref_name }} \
              | sudo SLIPSTREAM_VERSION=${{ github.ref_name }} bash
            ```

            Slipstream takes over system configuration — do not install it on a
            machine already running something you care about.
