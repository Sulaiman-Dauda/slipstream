name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the UI
        run: cd ui && npm ci && npm run build

      # ui/dist is committed because go:embed needs it to build without npm.
      # If it drifts from ui/src, the binary silently ships a stale interface.
      - name: Check the committed UI build is current
        run: |
          if ! git diff --quiet -- ui/dist; then
            echo "::error::ui/dist is out of date. Run 'make ui' and commit the result."
            git diff --stat -- ui/dist
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^ui/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test -race ./...

      - name: Build release binaries
        run: make dist

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the installer and scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC2086 (word splitting) is intentional in places; warnings only.
          shellcheck --severity=error installer/install.sh scripts/*.sh
