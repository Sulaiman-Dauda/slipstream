# Rebuilds slipstreampanel.com whenever the documentation changes. The site
# pulls /docs from this repo at build time rather than keeping its own copy, so
# a docs change here needs a build there.
#
# This uses a Cloudflare Pages **deploy hook** rather than a GitHub personal
# access token. The hook is a single secret URL that can do exactly one thing —
# start a build of one Pages project. A PAT with repository-dispatch rights
# would be a far more valuable secret to hold in a public repository, and the
# previous version of this workflow failed with 401 because no such token was
# ever set, leaving a permanently red check on main.
#
# Secret: CF_PAGES_DEPLOY_HOOK
name: Rebuild the documentation site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

# Nothing here reads or writes repository contents.
permissions: {}

concurrency:
  group: docs-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Pages build
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::CF_PAGES_DEPLOY_HOOK is not set — skipping. The site can be rebuilt from the Cloudflare dashboard."
            exit 0
          fi
          # -f so a non-2xx is a real failure rather than a silent success.
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "::notice::Documentation site rebuild triggered."
