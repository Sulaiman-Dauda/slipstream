# Rebuilds the website whenever the documentation changes, so the published docs
# stay in sync with /docs. The site pulls these files at build time rather than
# keeping its own copy.
#
# Requires a repository secret WEBSITE_DISPATCH_TOKEN: a fine-grained personal
# access token with permission to dispatch workflows on
# Sulaiman-Dauda/slipstream-website. Without it this job fails harmlessly and
# the site can still be rebuilt manually from its Actions tab.
name: Notify website of docs changes

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # A missing token should not show up as a broken build on the main repo.
    continue-on-error: true
    steps:
      - name: Trigger website rebuild
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/Sulaiman-Dauda/slipstream-website/dispatches \
            -d '{"event_type":"docs-updated"}'
